plugins {
    id 'io.kestra.gradle.repository-conventions' version '1.2.12'
    id "io.kestra.gradle.plugin-doc-lint" version '1.2.12'
    id 'io.kestra.gradle.spotless-conventions' version '1.2.12'
    id "com.vanniktech.maven.publish" version "0.37.0"
    id "io.kestra.gradle.inject-bom-versions" version '1.2.12'
    id 'java-library'
    id "idea"
    id 'jacoco'
    id "com.gradleup.shadow" version "9.6.1"
    id 'signing'
    id 'net.researchgate.release' version '3.2.0'
}

def isBuildSnapshot = version.toString().endsWith("-SNAPSHOT")

repositories {
    mavenLocal()
    mavenCentral()
    if (isBuildSnapshot) {
        maven { url "https://central.sonatype.com/repository/maven-snapshots/" }
    }
}

final targetJavaVersion = JavaVersion.VERSION_21

java {
    sourceCompatibility = targetJavaVersion
    targetCompatibility = targetJavaVersion
}

group = "io.kestra.plugin"
description = 'Apache Beam Plugin for Kestra'

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.add("-parameters")
}

configurations.configureEach {
    // Security pin (jackson-databind / jackson-core CVEs): remove once the Kestra platform BOM bumps Jackson to 2.21.7+.
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "com.fasterxml.jackson.core" && ["jackson-databind", "jackson-core"].contains(details.requested.name)) {
            details.useVersion("2.21.7")
            details.because("jackson-databind and jackson-core security fixes")
        }
    }
    // SEC-0369: platform BOM pins guava 33.4.8-jre, remove once it ships >= 33.7.2.
    resolutionStrategy.force "com.google.guava:guava:33.7.2-jre"
    // SEC-0370: snappy-java comes via flink-runtime, remove once Flink/Beam or the Kestra platform BOM ship >= 1.1.10.9.
    resolutionStrategy.force "org.xerial.snappy:snappy-java:1.1.10.9"
    // SEC-0184/0233/0204: wire and kaml come via Beam's apicurio protobuf utilities, remove once Beam ships patched versions.
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "com.squareup.wire") {
            details.useVersion("6.4.5")
        } else if (details.requested.group == "com.charleskorn.kaml" && details.requested.name == "kaml") {
            details.useVersion("0.104.0")
        }
    }
    exclude group: "com.fasterxml.jackson.module", module: "jackson-module-scala_2.12"
    exclude group: "com.fasterxml.jackson.module", module: "jackson-module-scala_2.13"
}

dependencies {
    // Platform
    annotationProcessor enforcedPlatform("io.kestra:platform:$kestraVersion")
    implementation enforcedPlatform("io.kestra:platform:$kestraVersion")
    constraints {
        // Keep OpenTelemetry autoconfigure modules aligned with Kestra platform to avoid runtime NoSuchMethodError.
        implementation("io.opentelemetry:opentelemetry-sdk-extension-autoconfigure:1.67.0") {
            version {
                strictly("1.51.0")
            }
        }
        implementation("io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi:1.67.0") {
            version {
                strictly("1.51.0")
            }
        }
    }

    // lombok
    annotationProcessor "org.projectlombok:lombok"
    compileOnly "org.projectlombok:lombok"

    // kestra
    annotationProcessor group: "io.kestra", name: "processor", version: kestraVersion
    compileOnly group: "io.kestra", name: "core", version: kestraVersion
    compileOnly group: "io.kestra", name: "script", version: kestraVersion

    // Apache Beam
    implementation enforcedPlatform("org.apache.beam:beam-sdks-java-bom:$beamVersion")
    implementation "org.apache.beam:beam-sdks-java-core"
    implementation "org.apache.beam:beam-sdks-java-extensions-yaml"
    implementation "org.apache.beam:beam-sdks-java-extensions-python"
    implementation "org.apache.beam:beam-runners-direct-java"
    implementation "org.apache.beam:beam-runners-flink-1.18"
    implementation "org.apache.beam:beam-runners-spark-3"
    implementation "org.apache.beam:beam-runners-google-cloud-dataflow-java"
}


/**********************************************************************************************************************\
 * Test
 **********************************************************************************************************************/
test {
    useJUnitPlatform()
}

dependencies {
    // Platform
    testAnnotationProcessor enforcedPlatform("io.kestra:platform:$kestraVersion")
    testImplementation enforcedPlatform("io.kestra:platform:$kestraVersion")
    constraints {
        // Mirror the runtime alignment in test classpath.
        testImplementation("io.opentelemetry:opentelemetry-sdk-extension-autoconfigure:1.67.0") {
            version {
                strictly("1.51.0")
            }
        }
        testImplementation("io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi:1.67.0") {
            version {
                strictly("1.51.0")
            }
        }
    }

    // lombok
    testAnnotationProcessor "org.projectlombok:lombok"
    testCompileOnly 'org.projectlombok:lombok'

    // micronaut
    testAnnotationProcessor "io.micronaut:micronaut-inject-java"
    testAnnotationProcessor "io.micronaut.validation:micronaut-validation-processor"
    testImplementation "io.micronaut.test:micronaut-test-junit5"
    testImplementation "io.micronaut:micronaut-jackson-databind"

    // test deps needed only for to have a runner
    testAnnotationProcessor group: "io.kestra", name: "processor", version: kestraVersion
    testImplementation group: "io.kestra", name: "core", version: kestraVersion
    testImplementation group: "io.kestra", name: "tests", version: kestraVersion
    testImplementation group: "io.kestra", name: "script", version: kestraVersion
    testImplementation group: "io.kestra", name: "repository-memory", version: kestraVersion
    testImplementation group: "io.kestra", name: "runner-memory", version: kestraVersion
    testImplementation group: "io.kestra", name: "storage-local", version: kestraVersion

    // test
    testImplementation "org.junit.jupiter:junit-jupiter-engine"
    testImplementation "org.hamcrest:hamcrest"
    testImplementation "org.hamcrest:hamcrest-library"

    // sanity checks
    testImplementation "io.kestra.plugin:plugin-docker:1.8.4"
}

/**********************************************************************************************************************\
 * Allure Reports
 **********************************************************************************************************************/
dependencies {
    testImplementation enforcedPlatform("io.kestra:platform:$kestraVersion")
    testImplementation "io.qameta.allure:allure-junit5"
}

/**********************************************************************************************************************\
 * Jacoco
 **********************************************************************************************************************/
test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required.set(true)
    }
}

/**********************************************************************************************************************\
 * Publish
 **********************************************************************************************************************/
mavenPublishing {
    publishToMavenCentral(true)
    signAllPublications()
    coordinates("${project.group}", "${project.name}", "${project.version}")
    pom {
        name = "${project.name}"
        description = "${project.group}:${project.name}:${project.version}"
        url = "https://github.com/kestra-io/${project.name}"
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'tchiotludo'
                name = 'Dehon'
                email = 'ldehon@kestra.io'
            }
        }
        scm {
            connection = 'scm:git:'
            url = "https://github.com/kestra-io/${project.name}"
        }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    // Suppression this validation error as we want to enforce the Kestra platform
    suppressedValidationErrors.add('enforced-platform')
}

jar {
    manifest {
        attributes(
                "X-Kestra-Name": project.name,
                "X-Kestra-Title": "Apache Beam",
                "X-Kestra-Group": project.group + ".beam",
                "X-Kestra-Description": project.description,
                "X-Kestra-Version": project.version
        )
    }
}

shadowJar {
    archiveClassifier.set(null)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE // important to have all META-INF/services files from Beam (ServiceLoader mechanism)
    mergeServiceFiles()
    zip64 true
}

/**********************************************************************************************************************\
 * Version
 **********************************************************************************************************************/
release {
    preCommitText = 'chore(version):'
    preTagCommitMessage = 'update to version'
    tagCommitMessage = 'tag version'
    newVersionCommitMessage = 'update snapshot version'
    tagTemplate = 'v${version}'
    buildTasks = ['classes']
    git {
        requireBranch.set('main')
    }
}

/**********************************************************************************************************************\
 * Dev
 **********************************************************************************************************************/
idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
